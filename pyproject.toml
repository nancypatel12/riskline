[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "riskline"
version = "0.1.0"
description = "Credit default risk, end to end: calibrated scores, cost-optimal decisions, FastAPI serving, drift monitoring, a privacy audit and a fairness audit."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nancy Patel" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "joblib>=1.4",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pyyaml>=6",
  "scikit-learn>=1.6",
  "scipy>=1.13",
  "uvicorn>=0.30",
  "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]
plots = ["matplotlib>=3.9"]
privacy = ["trainleak @ https://github.com/nancypatel12/trainleak/archive/c9e237fe167c77d2437142aea87eb6a0ad0ef9b7.tar.gz"]

[project.urls]
Repository = "https://github.com/nancypatel12/riskline"

[tool.setuptools]
packages = ["riskline"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]
