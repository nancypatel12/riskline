name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build (trains on the real dataset)
        run: docker build -t riskline .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 riskline
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep -q '"status":"ok"'
          applicant='"limit_bal": 50000, "education": 2,
            "pay_1": 2, "pay_2": 2, "pay_3": 0, "pay_4": 0, "pay_5": 0, "pay_6": 0,
            "bill_amt1": 48000, "bill_amt2": 47000, "bill_amt3": 45000,
            "bill_amt4": 30000, "bill_amt5": 25000, "bill_amt6": 20000,
            "pay_amt1": 0, "pay_amt2": 1500, "pay_amt3": 1500,
            "pay_amt4": 1000, "pay_amt5": 1000, "pay_amt6": 1000'
          curl -sf -X POST localhost:8000/predict -H 'content-type: application/json' -d "{$applicant}" | tee /dev/stderr | grep -q probability
          # Protected attributes are rejected, not ignored.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/predict -H 'content-type: application/json' -d "{$applicant, \"sex\": 2}")
          test "$status" = 422
      - if: always()
        run: docker logs api || true
